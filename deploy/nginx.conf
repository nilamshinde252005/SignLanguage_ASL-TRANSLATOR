# nginx site for the ASL Translator static build (Next.js "output: export").
# setup-ec2.sh replaces __DOMAIN__ and certbot then adds the HTTPS (port 443) settings.
# (.wasm is already in nginx's mime.types; .tflite model files are served as binary by default.)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/asl-translator;
    index index.html;

    # Allow the page to use the camera; block other powerful features.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Build assets have a hash in their file name, so they can be cached for a long time.
    location /_next/static/ {
        expires max;
    }
    location /models/ {
        expires 7d;
    }
    # HTML pages: always check for a newer version.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires epoch;
    }
}
